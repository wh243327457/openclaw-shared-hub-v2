version: 1
kind: capability-manifest-index
path: registry/capabilities
entries:
  - agent_id: hermes
    file: registry/capabilities/hermes.yaml
  - agent_id: openclaw
    file: registry/capabilities/openclaw.yaml
  - agent_id: future-agent
    file: registry/capabilities/future-agent.yaml
rules:
  record_fields:
    - capability_id
    - provider
    - type
    - lifecycle
    - default_enabled
